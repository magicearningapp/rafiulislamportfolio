    <script>
      // Safe fetch descriptor guard to prevent errors if environment scripts reassign fetch
      try {
        let _currentFetch = window.fetch;
        Object.defineProperty(window, "fetch", {
          get() {
            return _currentFetch;
          },
          set(fn) {
            _currentFetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {}
    </script>
